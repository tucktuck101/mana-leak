[project]
name = "mana-leak-api"
version = "0.1.0"
description = "Mana Leak FastAPI and MCP adapters"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mana-leak-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "fastmcp>=2.0",
]

[tool.uv.sources]
mana-leak-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mana_leak_api"]
