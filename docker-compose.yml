name: mana-leak

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      MANA_LEAK_DB_PASSWORD: ${MANA_LEAK_DB_PASSWORD:?set MANA_LEAK_DB_PASSWORD in .env}
      LANGFUSE_DB_PASSWORD: ${LANGFUSE_DB_PASSWORD:?set LANGFUSE_DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mana_leak"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://mana_leak:${MANA_LEAK_DB_PASSWORD}@postgres:5432/mana_leak
      # Overrides the host-default LANGFUSE_HOST (unset in .env, so it falls
      # back to the Settings class's http://localhost:3001) with the
      # self-hosted langfuse-web container's URL for the M2 Langfuse stack
      # (langfuse-web is part of this Compose file; see the stack block
      # below). Set LANGFUSE_HOST in .env (e.g. to a Langfuse Cloud URL) to
      # override this default without editing this file.
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse-web:3000}
    volumes:
      # Downloaded bulk card data (ingest_cards) and other runtime files;
      # excluded from the image by .dockerignore, kept on the host instead.
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  web:
    build:
      context: apps/web
    environment:
      # Server-side only: used by the Next.js /api proxy route handler to reach
      # the API. Never exposed to the browser (no NEXT_PUBLIC_ prefix).
      API_BASE_URL: http://api:8000
    depends_on:
      # No api healthcheck exists yet (the /health route is added in M1);
      # wait only for the api process to start, not for it to report healthy.
      api:
        condition: service_started
    ports:
      - "127.0.0.1:3000:3000"

  # Langfuse stack (M2): self-hosted Langfuse (langfuse-web, langfuse-worker,
  # clickhouse, redis/valkey, minio) following the current official Langfuse
  # docker-compose for the pinned version. Langfuse must use the dedicated
  # `langfuse` database/user created by scripts/postgres-init/01-databases.sh,
  # never the `mana_leak` database.

volumes:
  postgres-data:
