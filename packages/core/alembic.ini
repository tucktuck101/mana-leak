# Mana Leak core migrations (`docs/data-model.md` -> Migration approach).
# Run as: uv run alembic -c packages/core/alembic.ini upgrade head
# env.py reads the database URL from `Settings().database_url`, not from
# this file, so there is no `sqlalchemy.url` key here.

[alembic]
# %(here)s resolves relative to this file, so the command works regardless
# of the caller's working directory.
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
