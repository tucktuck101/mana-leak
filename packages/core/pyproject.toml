[project]
name = "mana-leak-core"
version = "0.1.0"
description = "Shared Mana Leak core: cards, combos, rules, judge"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "litellm>=1.50",
    "langfuse>=2.50",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mana_leak_core"]
